<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBIZA | The Final Memory</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Oswald:wght@300;400;500;700&family=Inter:wght@200;300;400;500&display=swap');

        :root {
            --black: #010102;
            --black-blue: #04050a;
            --amber: #e86a24;
            --cyan: #2a6872;
            --white: #f8f3eb;
            --ghost: rgba(248, 243, 235, 0.42);
            --scroll: 0;
            --frames-opacity: 0;
            --rsvp-opacity: 0;
            --leaks-pos: 0% 0%;
            --cursor-x: 50vw;
            --cursor-y: 50vh;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--black);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--black);
            color: var(--white);
            cursor: none;
            font-family: Inter, sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        body.locked {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* PERFORMANCE OPTIMIZATIONS:
           - Reduced blur filters on large elements
           - Removed heavy SVG grain, replaced with simple CSS
           - Removed layered blend modes where unnecessary
           - Use will-change: transform for animated elements
        */

        .bg-urban {
            position: fixed;
            inset: -10%;
            width: 120%;
            height: 120%;
            background-image: url("public/assets/urban nightscape through blurred glass.png");
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            filter: blur(10px);
            z-index: 1;
            pointer-events: none;
            will-change: transform;
            animation: bgDrift 20s ease-in-out infinite alternate;
        }

        .bg-hero {
            position: fixed;
            inset: 0;
            background-image: url("public/assets/hero.png");
            background-size: cover;
            background-position: center;
            opacity: calc(0.35 - var(--scroll) * 0.4);
            z-index: 2;
            pointer-events: none;
            will-change: opacity;
            mask-image: linear-gradient(180deg, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(180deg, black 0%, transparent 100%);
        }

        /* Cursor */
        .cursor-dot {
            position: fixed;
            left: var(--cursor-x);
            top: var(--cursor-y);
            z-index: 100;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--white);
            transform: translate(-50%, -50%);
            pointer-events: none;
            mix-blend-mode: difference;
            transition: transform 0.2s ease;
            will-change: transform, left, top;
        }

        /* Intro Gate */
        #gate {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: grid;
            place-items: center;
            background: var(--black);
            overflow: hidden;
            transition: opacity 1s ease;
        }

        #gate.leaving {
            opacity: 0;
            pointer-events: none;
        }

        .rotating-intro-bg {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: url("public/assets/memory fragments.png");
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            animation: rotateFast 1.5s linear infinite;
            z-index: 1;
            will-change: transform;
        }

        .gate-inner {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .ritual-text {
            font-family: "Playfair Display", serif;
            font-size: clamp(1.25rem, 4vw, 3rem);
            font-style: italic;
            color: var(--ghost);
            text-shadow: 0 0 20px rgba(248, 243, 235, 0.1);
        }

        .trigger-btn {
            position: relative;
            margin-top: 2.8rem;
            border: 1px solid rgba(248, 243, 235, 0.3);
            padding: 1rem 3rem;
            background: transparent;
            color: rgba(248, 243, 235, 0.8);
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .trigger-btn:hover {
            background: rgba(248, 243, 235, 0.1);
            color: var(--white);
        }

        /* Memory Space */
        #memory-space {
            position: relative;
            z-index: 10;
            min-height: 500vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
        }

        body.live #memory-space {
            opacity: 1;
            visibility: visible;
        }

        .sticky-stage {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Typography */
        .mass-type {
            font-family: Oswald, sans-serif;
            font-weight: 500;
            line-height: 0.8;
            text-transform: uppercase;
        }

        .whisper-type {
            font-family: "Playfair Display", serif;
            font-style: italic;
            font-weight: 400;
            line-height: 1.1;
        }

        .meta {
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Hero */
        .hero-copy {
            position: absolute;
            left: 5vw;
            top: 20vh;
            z-index: 20;
            will-change: transform, opacity;
            transform: translateY(calc(var(--scroll) * -30vh));
            opacity: calc(1 - var(--scroll) * 2);
        }

        .hero-title {
            font-size: clamp(4rem, 15vw, 12rem);
            color: rgba(248, 243, 235, 0.9);
            text-shadow: 0 0 20px rgba(248, 243, 235, 0.2);
        }

        .hero-sub {
            color: rgba(232, 106, 36, 0.9);
            font-size: clamp(1.5rem, 5vw, 4rem);
            margin-top: -1rem;
            margin-left: 5vw;
        }

        /* Leaks Overlay */
        .leaks-overlay {
            position: absolute;
            inset: 0;
            z-index: 15;
            background-image: url("public/assets/nightlife leaks.png");
            background-size: 200% 200%;
            background-position: var(--leaks-pos);
            opacity: calc(var(--frames-opacity) * 0.75);
            pointer-events: none;
            mix-blend-mode: screen;
            transition: background-position 0.2s ease;
            will-change: background-position;
        }

        /* RSVP */
        .rsvp-plane {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: grid;
            place-items: center;
            opacity: var(--rsvp-opacity);
            pointer-events: var(--rsvp-events);
            background-image: url("public/assets/ibiza memories.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            will-change: opacity;
        }

        /* Dark overlay for RSVP for readability */
        .rsvp-plane::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(1, 1, 2, 0.82);
            z-index: 0;
        }

        .rsvp-inner {
            position: relative;
            z-index: 1;
            width: min(600px, 90vw);
            text-align: center;
        }

        .rsvp-title {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 3rem;
        }

        .memory-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 2rem;
            background: rgba(248, 243, 235, 0.05);
            border: 1px solid rgba(248, 243, 235, 0.2);
            color: var(--white);
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .memory-input:focus {
            outline: none;
            border-color: var(--amber);
            background: rgba(232, 106, 36, 0.1);
        }

        .memory-submit {
            padding: 1.5rem 3rem;
            background: var(--amber);
            color: var(--black);
            border: none;
            font-weight: bold;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: transform 0.2s ease, background 0.3s ease;
            width: 100%;
        }

        .memory-submit:hover {
            transform: scale(1.05);
            background: #ff7b30;
        }

        @keyframes rotateFast {
            from {
                transform: rotate(0deg) scale(1.5);
            }

            to {
                transform: rotate(360deg) scale(1.5);
            }
        }

        @keyframes float {
            from {
                transform: translateY(-30px);
            }

            to {
                transform: translateY(30px);
            }
        }

        @keyframes bgDrift {
            from {
                transform: translate(-2%, -2%) scale(1.05);
            }

            to {
                transform: translate(2%, 2%) scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .bg-urban {
                animation: none;
            }
        }
    </style>
</head>

<body class="locked">
    <div class="bg-urban" aria-hidden="true"></div>
    <div class="bg-hero" aria-hidden="true"></div>
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

    <div id="gate">
        <div class="rotating-intro-bg" aria-hidden="true"></div>
        <div class="gate-inner">
            <p class="ritual-text">Some nights refuse to finish. They just keep projecting somewhere.</p>
            <button class="trigger-btn interactable" type="button" id="openMemory">Open the archive</button>
        </div>
    </div>

    <main id="memory-space" aria-label="IBIZA farewell memory experience">
        <div class="sticky-stage">

            <section class="hero-copy" aria-labelledby="ibiza-title">
                <p class="meta hero-kicker">02:17 AM // the signal never stopped</p>
                <h1 class="mass-type hero-title" id="ibiza-title">IBIZA</h1>
                <p class="whisper-type hero-sub">before we disappear entirely.</p>
            </section>

            <div class="leaks-overlay" aria-hidden="true"></div>

            <section class="rsvp-plane" aria-labelledby="rsvp-title">
                <div class="rsvp-inner">
                    <p class="meta" style="color: var(--amber); margin-bottom: 1rem;">the last thing left</p>
                    <h2 class="whisper-type rsvp-title" id="rsvp-title">confirm you were here. leave something behind.
                    </h2>

                    <form class="memory-form" id="rsvpForm">
                        <div class="field interactable">
                            <label class="sr-only" for="guestName">Your name</label>
                            <input class="memory-input" id="guestName" name="guestName" type="text"
                                placeholder="Your Name" autocomplete="name" required>
                        </div>
                        <div class="field interactable">
                            <label class="sr-only" for="studentId">Student ID</label>
                            <input class="memory-input" id="studentId" name="studentId" type="text"
                                placeholder="Student ID" required>
                        </div>
                        <button class="memory-submit interactable" type="submit">Seal the Memory</button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <script>
        const root = document.documentElement;
        const body = document.body;
        const gate = document.getElementById('gate');
        const openMemory = document.getElementById('openMemory');
        const cursorDot = document.getElementById('cursorDot');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let isScrolling = false;

        function setCursor(x, y) {
            root.style.setProperty('--cursor-x', `${x}px`);
            root.style.setProperty('--cursor-y', `${y}px`);
        }

        function igniteMemory() {
            gate.classList.add('leaving');
            setTimeout(() => {
                gate.style.display = 'none';
                body.classList.remove('locked');
                body.classList.add('live');
                updateScrollState();
            }, 1000);
        }

        function updateScrollState() {
            if (!isScrolling) {
                window.requestAnimationFrame(() => {
                    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                    const progress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
                    root.style.setProperty('--scroll', progress.toFixed(4));

                    const framesIn = (progress - 0.1) * 3;
                    const framesOut = (0.8 - progress) * 4;
                    const framesOpacity = Math.max(0, Math.min(1, framesIn, framesOut));
                    root.style.setProperty('--frames-opacity', framesOpacity.toFixed(4));

                    const positions = ['0% 0%', '100% 0%', '100% 100%', '0% 100%'];
                    const frameIndex = Math.floor(window.scrollY / 200) % 4;
                    root.style.setProperty('--leaks-pos', positions[frameIndex]);

                    const rsvpOpacity = Math.max(0, Math.min(1, (progress - 0.7) * 4));
                    root.style.setProperty('--rsvp-opacity', rsvpOpacity.toFixed(4));
                    root.style.setProperty('--rsvp-events', rsvpOpacity > 0.5 ? 'auto' : 'none');

                    isScrolling = false;
                });
                isScrolling = true;
            }
        }

        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
            setCursor(mouseX, mouseY);
        }, { passive: true });

        document.querySelectorAll('.interactable').forEach((element) => {
            element.addEventListener('mouseenter', () => {
                cursorDot.style.transform = 'translate(-50%, -50%) scale(2.5)';
            });
            element.addEventListener('mouseleave', () => {
                cursorDot.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });

        document.getElementById('rsvpForm').addEventListener('submit', (event) => {
            event.preventDefault();
            alert('Memory sealed.');
        });

        openMemory.addEventListener('click', igniteMemory);
        window.addEventListener('scroll', updateScrollState, { passive: true });
        window.addEventListener('resize', updateScrollState, { passive: true });

        setCursor(mouseX, mouseY);
        updateScrollState();
    </script>
</body>

</html>
